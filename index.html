<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>beszoptak.hu – Kik hova kerültek?</title>
  <meta name="description" content="Képes bemutató arról, hogy kik kerültek kategorizálásra: sittre, előzetesbe, vagy adtak vissza pénzt.">
  <link rel="preconnect" href="https://upload.wikimedia.org">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="fejlec">
    <div class="fejlec-belseje">
      <h1 class="logo">beszoptak<span>.hu</span></h1>
      <p class="alcim">Kik kerültek eddig sittre, előzetesbe – vagy adták vissza a pénzt?</p>
    </div>
  </header>

  <nav class="szurok" id="szurok">
    <button class="szuro aktiv" data-kat="mind">Mind</button>
    <button class="szuro" data-kat="sitt">⛓️ Sittre került</button>
    <button class="szuro" data-kat="elozetes">🚔 Előzetesben</button>
    <button class="szuro" data-kat="felkeszul">⚖️ Felkészül</button>
    <button class="szuro" data-kat="tanu">🕊️ Tanúskodik</button>
    <button class="szuro" data-kat="kapta">💰 Kapta a pénzt</button>
    <button class="szuro" data-kat="visszafizetes">💸 Visszaadta a pénzt</button>
    <input type="search" id="kereses" class="kereses" placeholder="Keresés névvel, céggel… (ékezet nélkül is)" title="Kis/nagybetű és ékezet nem számít. Több címke is egyszerre bekapcsolható.">
  </nav>

  <div class="szamlalo-sor" aria-live="polite">
    <span class="szamlalo-cim">💸 Eddig visszafizetett összeg</span>
    <span><span class="szamlalo-ertek" id="szamlalo">0</span><span class="szamlalo-eveg"> Ft</span></span>
    <span class="szamlalo-resz" id="szamlalo-resz"></span>
  </div>

  <main id="galeria" class="galeria"></main>

  <footer class="labjegyzet">
    <p>Forrás: <a href="https://github.com/ferkomes/beszoptak.hu" target="_blank" rel="noopener">github.com/ferkomes/beszoptak.hu</a> ·
    Adatok tájékoztató jellegűek, nyilvános híradások alapján ·
    Képek: Wikipédia / Wikimedia Commons (CC)</p>
  </footer>

  <div class="nagyito" id="nagyito" hidden>
    <button class="nagyito-zar" id="nagyito-zar" aria-label="Bezárás">×</button>
    <figure>
      <img id="nagyito-kep" alt="">
      <figcaption id="nagyito-felirat"></figcaption>
    </figure>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
